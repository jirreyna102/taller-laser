<style>
/* ===== Tokens ===== */

.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);min-height:var(--tap);padding:0 16px;border-radius:var(--r-sm);border:1px solid var(--ac);background:var(--ac);color:var(--acx);font:600 var(--fs-sm)/1.2 var(--font);cursor:pointer;text-align:center;box-shadow:0 1px 2px rgba(29,78,216,.25);transition:background .12s,border-color .12s}

.notice:empty{display:none}
/* ===== Data ===== */
.table-wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:var(--r-sm)}
.card.table-wrap{padding:0}

function idb(){if(!IDBP)IDBP=new Promise(res=>{try{const rq=indexedDB.open('sl_taller_fotos',1);rq.onupgradeneeded=()=>rq.result.createObjectStore('fotos',{keyPath:'id'});rq.onsuccess=()=>res(rq.result);rq.onerror=()=>res(null);rq.onblocked=()=>res(null)}catch(e){res(null)}});return IDBP}
async function idbDo(mode,fn){const db=await idb();if(!db)return null;return new Promise(res=>{try{const tx=db.transaction('fotos',mode),st=tx.objectStore('fotos'),rq=fn(st);tx.oncomplete=()=>res(rq?rq.result:true);tx.onerror=()=>res(null);tx.onabort=()=>res(null)}catch(e){res(null)}})}
const fotoPut=async o=>{const r=await idbDo('readwrite',st=>st.put(o));if(r&&typeof cloudBlobUp==='function')cloudBlobUp(o);return r},fotoGet=async id=>{let r=await idbDo('readonly',st=>st.get(id));if(!r&&typeof cloudBlobGet==='function')r=await cloudBlobGet(id);return r},fotoDel=async id=>{const r=await idbDo('readwrite',st=>st.delete(id));if(typeof CL!=='undefined'&&S.blobs){const b=S.blobs.find(x=>x.id===id);if(b){S.blobs=S.blobs.filter(x=>x.id!==id);if(CL.assets&&CL.admin)try{await CL.assets.delete(b.asset_id)}catch(e){}save()}}return r},fotoAll=()=>idbDo('readonly',st=>st.getAll()),fotoClear=()=>idbDo('readwrite',st=>st.clear());
function reduceImg(file){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const s=Math.min(1,1000/Math.max(im.naturalWidth,im.naturalHeight)),w=Math.max(1,Math.round(im.naturalWidth*s)),h=Math.max(1,Math.round(im.naturalHeight*s)),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',.72)};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};im.src=u})}
const blobToData=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=()=>r(null);fr.readAsDataURL(b)});
function dataToBlob(d){const m=/^data:(image\/(?:jpeg|png|webp));base64,([A-Za-z0-9+/=]+)$/.exec(String(d||''));if(!m)return null;const bin=atob(m[2]),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m[1]})}
let THUMB_URLS=[];
async function loadThumbs(){THUMB_URLS.forEach(u=>URL.revokeObjectURL(u));THUMB_URLS=[];for(const el of document.querySelectorAll('[data-foto]')){const f=await fotoGet(el.dataset.foto);const img=el.querySelector('img');if(f&&f.blob&&img){const u=URL.createObjectURL(f.blob);THUMB_URLS.push(u);img.src=u}else el.replaceWith(Object.assign(document.createElement('span'),{className:'text-muted text-xs',textContent:'Foto no disponible en este navegador'}))}}

/* ================= Descargar / copiar ================= */
async function dl(filename,data){if(BUILD==='desktop'){try{const b=data instanceof Blob?data:new Blob([data]),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return true}catch(e){toast('No se pudo descargar');return false}}let d=null;try{d=window.claude&&await claude.use('downloads')}catch(e){}if(!d){toast('La descarga no está disponible aquí. Usa Copiar y pégalo en un archivo.');return false}try{await d.save({filename,data});return true}catch(e){if(e&&e.code==='rejected_extension')toast('Ese tipo de archivo no se puede descargar desde aquí (permitidos: svg, png, jpg, pdf, html, txt, json, zip…).');else if(e&&e.code!=='declined')toast('No se pudo guardar: '+(e.message||e.code));return false}}
function cp(text,ok){navigator.clipboard.writeText(text).then(()=>toast(ok||'Copiado'),()=>toast('No se pudo copiar'))}

<div class="notice notice--wa">El SVG multicolor de esta matriz <b>no sirve como matriz en LaserGRBL</b>: LaserGRBL importa un SVG como un solo trabajo, con una sola velocidad y potencia (su importación de SVG además está marcada como experimental). Usa su generador integrado con estos mismos rangos.</div>

<li>${m.op==='Corte'?'Menú Generar › <b>Prueba de corte</b> (Cutting Test). <i>Verificar</i> el nombre en tu versión.':'Menú Generar › <b>Prueba de potencia vs velocidad</b> (Power vs Speed Test, incluida desde LaserGRBL 6.0). <i>Verificar</i> el nombre en tu versión.'}</li>

${m.int&&m.op!=='Corte'?`<li>Calidad de relleno: <b>${lpm(m.int)} líneas/mm</b> (= intervalo ${m.int} mm).</li>`:''}
<li>Modo láser: LaserGRBL trabaja por defecto con M3 (potencia constante). Deja el mismo modo en todas tus pruebas y anótalo en la matriz${m.modo?` (aquí: ${esc(MODOL[m.modo])})`:''}.</li>

function nestRead(){NZ={LW:Math.max(10,n('n_lw')),LH:Math.max(10,n('n_lh')),UW:Math.max(10,n('n_uw')),UH:Math.max(10,n('n_uh')),marg:Math.max(0,num(g('n_mg'))),gap:Math.max(0,num(g('n_gp'))),div:Math.max(0,num(g('n_dv'))),rot:$('n_rot').checked,src:g('n_src'),pw:Math.max(1,n('n_pw')),ph:Math.max(1,n('n_ph')),forma:g('n_fm')}}
function nestRender(){const out=$('n_out');if(!out)return;const man=NZ.src==='manual';['n_pw','n_ph','n_fm'].forEach(id=>$(id).disabled=!man);if(man&&NZ.forma==='circulo')$('n_ph').disabled=true;
const src=nestSource(),b=nestCalc(NZ,src.pw,src.ph),kf=DZ&&NZ.src==='diseno'?kerfInfo(DZ).kf:null;if(!b||!b.tot){out.innerHTML=`<div class="notice">Con estas medidas no sale ninguna pieza: revisa el área útil, el margen o el tamaño de la pieza (${esc(src.label)}).</div>`;return}

${kf&&NZ.gap<kf.kerf_mm*2?`<div class="notice notice--wa">La separación (${NZ.gap} mm) es muy justa para un kerf de ${kf.kerf_mm} mm; las piezas pueden compartir línea de corte y quemar bordes.</div>`:''}

function readDpi(buf){try{const u=new Uint8Array(buf),dv=new DataView(buf);if(u[0]===0x89&&u[1]===0x50){let i=8;while(i+12<=u.length){const len=dv.getUint32(i),typ=String.fromCharCode(u[i+4],u[i+5],u[i+6],u[i+7]);if(typ==='pHYs')return u[i+16]===1?Math.round(dv.getUint32(i+8)*0.0254):null;if(typ==='IDAT'||typ==='IEND')return null;i+=12+len}}else if(u[0]===0xFF&&u[1]===0xD8){let i=2;while(i+4<u.length){if(u[i]!==0xFF)return null;const mk=u[i+1],len=dv.getUint16(i+2);if(mk===0xE0&&String.fromCharCode(u[i+4],u[i+5],u[i+6],u[i+7])==='JFIF'){const un=u[i+11],x=dv.getUint16(i+12);return un===1?x:un===2?Math.round(x*2.54):null}if(mk===0xDA)return null;i+=2+len}}}catch(e){}return null}

function iaCheck(r,p,rcp){const notes=[];let p2=null;if(!r||typeof r!=='object')return{notes:['Respuesta vacía.'],p2};const v=r.variable;if(!(v in IAVARS)){notes.push('La respuesta no indicó una variable válida; no se prepara la prueba.');return{notes,p2}}if(v==='ninguna')return{notes,p2};const k=IAVARS[v];if(!p){notes.push('No hay parámetros de referencia.');return{notes,p2}}
if((k==='vel'||k==='pot')&&!p.vel){notes.push('La receta no tiene velocidad y potencia: haz primero una matriz en Calibrar. La app no toma valores de la IA como punto de partida.');return{notes,p2}}
p2={...p};if(k==='aire'){p2.aire=/^n/i.test(String(r.valor_sugerido||r.direccion))?'No':'Sí'}else{let val=numOrNull(r.valor_sugerido);const old=num(p[k]);if(val==null){notes.push('No dio un valor numérico; ajusta tú el valor en la prueba.');val=old}
if(['vel','pot','int'].includes(k)&&old>0){const lo=old*.75,hi=old*1.25;if(val<lo||val>hi){notes.push(`El cambio propuesto (${val}) se sale de ±25 % del valor actual (${old}); se limitó a ${r2(Math.min(hi,Math.max(lo,val)))}.`);val=Math.min(hi,Math.max(lo,val))}}
if(k==='pot')val=Math.min(100,Math.max(0.1,val));if(k==='pas')val=Math.max(1,Math.min(p.pas+2,Math.round(val)));if(k==='int'&&!(val>0)){notes.push('Intervalo inválido.');return{notes,p2:null}}p2[k]=k==='vel'?(p.unidad==='mm/s'?r2(val):Math.round(val)):r2(val)}
if(velS(p2)>MAXV_S){notes.push(`La velocidad sugerida supera ${MAXV_S} mm/s; no se prepara.`);return{notes,p2:null}}const d=diffP(p2,p);if(d.length>1){notes.push('Cambiaba más de una variable; no se prepara.');return{notes,p2:null}}if(rcp&&estado(rcp)==='No apta'){notes.push('La receta está marcada “No apta”.');return{notes,p2:null}}return{notes,p2}}
